name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vision_law_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vision_law_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          cp -n .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Pint (style)
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests (PostgreSQL)
        run: php artisan test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy-visionlaw
    steps:
      - name: Deploy to dev server
        env:
          DEPLOY_KEY: ${{ secrets.VISIONLAW_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          wc -c ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null && echo "deploy key format OK"
          ssh-keyscan -t ed25519 172.235.37.44 >> ~/.ssh/known_hosts 2>/dev/null
          # The server-side key is forced-command: any remote command runs /opt/vision-law/deploy.sh
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@172.235.37.44 true
          rm -f ~/.ssh/id_deploy

      - name: Smoke check
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null http://172.235.37.44:3100/up
